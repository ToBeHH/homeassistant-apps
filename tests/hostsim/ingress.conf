# Like Home Assistant's ingress: strips the prefix, comes from 172.30.32.2.
worker_processes 1;
pid /run/ingress.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_max_body_size 0;

    server {
        listen 8123;

        location /api/hassio_ingress/TOK/ {
            proxy_pass http://172.30.32.3:8099/;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_buffering off;
        }
    }
}
