name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

jobs:
  find:
    name: Find apps
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.addons.outputs.addons_list }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: 🔍 Find app directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

  lint:
    name: Lint app ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      matrix:
        path: ${{ fromJson(needs.find.outputs.addons) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: 🚀 Run Home Assistant App Lint
        uses: frenck/action-addon-linter@v2.21
        with:
          path: "./${{ matrix.path }}"

  hadolint:
    name: Hadolint ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      matrix:
        path: ${{ fromJson(needs.find.outputs.addons) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: 🚀 Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "./${{ matrix.path }}/Dockerfile"

  yamllint:
    name: YAMLlint
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: 🚀 Run yamllint
        run: pipx run yamllint --strict .

  unittest:
    name: Downloader tests
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          # Same minor version as python3 in the app image (Alpine 3.23)
          python-version: "3.12"

      - name: 🚀 Run unit tests
        working-directory: offline_knowledge/downloader
        run: python -m unittest discover -t . -s tests -v

      - name: 🚀 Run MCP server unit tests
        working-directory: offline_knowledge/mcp_server
        run: python -m unittest discover -t . -s tests -v

      - name: 🚀 Run Kolibri channel sync unit tests
        working-directory: kolibri/channel_sync
        run: python -m unittest discover -t . -s tests -v

  apparmor:
    name: AppArmor ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.find.outputs.addons) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: 🔒 Load the profile in enforce mode
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apparmor-utils
          sed 's/,complain)/)/' "${{ matrix.path }}/apparmor.txt" > profile.txt
          sudo apparmor_parser -r -W profile.txt

      - name: 🏗 Build the image
        run: docker build -t hostsim/app "./${{ matrix.path }}"

      - name: 🚀 Run the app under the profile
        run: tests/hostsim/run.sh "${{ matrix.path }}" hostsim/app "${{ matrix.path }}"

      - name: 🔍 Look for AppArmor denials
        if: always()
        run: |
          if sudo journalctl -k --no-pager | grep -F 'apparmor="DENIED"' | grep -F "${{ matrix.path }}"; then
            exit 1
          fi

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: 🚀 Run ShellCheck on service scripts
        run: |
          find . -path '*/rootfs/etc/services.d/*' -type f -print0 | xargs -0 shellcheck -x
          shellcheck -x tests/hostsim/run.sh
