# https://developers.home-assistant.io/docs/apps/configuration
name: Offline Knowledge
version: "0.3.0"
slug: offline_knowledge
description: >-
  Wikipedia and other reference works, offline maps and data tools,
  available without an internet connection.
url: "https://github.com/ToBeHH/homeassistant-apps/tree/main/offline_knowledge"
stage: experimental
arch:
  - amd64
init: false
startup: services
ingress: true
panel_icon: mdi:bookshelf
backup_exclude:
  # Zimi's indexes and caches can be rebuilt; settings stay in the backup.
  - "zimi/titles"
  - "zimi/thumbs"
  - "zimi/qids"
  - "zimi/staging"
  - "zimi/tools"
  - "zimi/*cache*.json"
  - "zimi/dym_vocab.json"
  - "downloader/catalog.xml"
  - "zimi/catalog_*.json"
ports:
  8899/tcp: null
ports_description:
  8899/tcp: Library web interface (off by default, local network only)
map:
  - share:rw
  - media:rw
options:
  data_path: ""
  profile: slim
  languages:
    - en
  zim_sources: []
  prune: false
  download_limit: 0
schema:
  data_path: str?
  profile: list(slim|standard|full|custom)
  languages:
    - match(^[a-z]{2,3}$)
  zim_sources:
    - str
  prune: bool
  download_window: match(^([01][0-9]|2[0-3]):[0-5][0-9]-([01][0-9]|2[0-3]):[0-5][0-9]$)?
  download_limit: int(0,)
image: "ghcr.io/tobehh/ha-app-offline-knowledge"
