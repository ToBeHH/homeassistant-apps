configuration:
  data_path:
    name: Speicherort
    description: >-
      Ordner für alle Inhalte (ZIM-Dateien, Karten, Indizes), z. B. /share/offline_knowledge
      oder ein Ordner auf einer externen Platte unter /media. Es wird nichts
      heruntergeladen, solange dieser Pfad nicht gesetzt ist und der Ordner existiert.
  profile:
    name: Inhaltsprofil
    description: >-
      Je Sprache: slim (ca. 20–25 GB), standard (ca. 60–75 GB), full (ca.
      75–150 GB) oder custom (nur die unten aufgeführten Quellen).
  languages:
    name: Sprachen
    description: Sprachcodes für die Inhalte, z. B. de und en.
  zim_sources:
    name: Zusätzliche Quellen
    description: >-
      Weitere Kiwix-ZIM-Namen ohne Datum, z. B. wikipedia_de_all_maxi. Beim Profil
      custom ist das die vollständige Liste.
  prune:
    name: Abgewählte Inhalte entfernen
    description: Inhalte löschen, die nicht mehr ausgewählt sind. Standardmäßig aus.
  download_window:
    name: Download-Zeitfenster
    description: >-
      Nur in diesem täglichen Zeitfenster herunterladen, z. B. 01:00-06:00. Leer
      bedeutet jederzeit.
  download_limit:
    name: Download-Geschwindigkeit
    description: Höchste Download-Geschwindigkeit in KB/s. 0 bedeutet ohne Begrenzung.
network:
  8899/tcp: >-
    Weboberfläche der Bibliothek. Standardmäßig aus; nur in einem vertrauenswürdigen
    lokalen Netz öffnen.
