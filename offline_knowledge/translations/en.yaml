configuration:
  data_path:
    name: Storage location
    description: >-
      Folder for all content (ZIM files, maps, indexes), e.g. /share/offline_knowledge
      or a folder on an external drive under /media. Nothing is downloaded until
      this is set and the folder exists.
  profile:
    name: Content profile
    description: >-
      Per language: slim (about 20–25 GB), standard (about 60–75 GB), full (about
      75–150 GB) or custom (only the sources listed below).
  languages:
    name: Languages
    description: Language codes for the content, e.g. de and en.
  zim_sources:
    name: Additional sources
    description: >-
      Extra Kiwix ZIM names without date, e.g. wikipedia_de_all_maxi. With the
      custom profile this is the complete list.
  prune:
    name: Remove deselected content
    description: Delete content that is no longer selected. Off by default.
  download_window:
    name: Download window
    description: >-
      Only download in this daily time window, e.g. 01:00-06:00. Empty means any time.
  download_limit:
    name: Download speed limit
    description: Maximum download speed in KB/s. 0 means no limit.
  update_interval_days:
    name: Content check interval
    description: >-
      Look for new editions of the library every this many days. New selections are
      also fetched at every start of the app.
  map_regions:
    name: Map regions
    description: >-
      Regions for offline maps: world (overview), germany, dach, africa, antarctica, asia,
      europe, north_america, oceania, south_america, optionally with a maximum zoom such as
      germany:12, or your own area as
      name=min_lon,min_lat,max_lon,max_lat[:zoom].
  map_update_days:
    name: Map update interval
    description: Renew maps when they are this many days old. 0 means never.
  mcp_tools:
    name: MCP tools
    description: >-
      full offers every tool, lean only search, read and read_section (for small
      models).
  place_search:
    name: Place search
    description: >-
      Search for places in the map viewer and through MCP. Downloads about 450 MB from
      GeoNames and builds a search index, which can take hours for large map regions.
network:
  8899/tcp: >-
    Library web interface. Off by default; only open it in a trusted local network.
  8900/tcp: >-
    MCP endpoint for AI assistants. The MCP server only runs with a port set here. Only
    open it in a trusted local network. Address and token are on the start page.
