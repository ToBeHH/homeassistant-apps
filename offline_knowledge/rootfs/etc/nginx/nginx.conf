# Landing page for Home Assistant ingress. Zimi itself can't run under the
# ingress path prefix (it builds absolute URLs), so it keeps its own port.
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;

    server {
        listen 8099 default_server;

        # Only the Home Assistant ingress gateway (and health checks inside
        # the container) may talk to this server.
        allow 172.30.32.2;
        allow 127.0.0.1;
        deny all;

        root /var/www/landing;
        index index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = /status.json {
            alias /data/downloader/status.json;
        }

        location = /info.json {
            alias /run/landing/info.json;
        }

        location = /library/health {
            proxy_pass http://127.0.0.1:8899/health;
        }

        location = /library/list {
            proxy_pass http://127.0.0.1:8899/list;
        }
    }
}
